# Owned by Harness CD (service ilmp_service_layer). A routine release changes only
# containerDefinitions[0].image; ilmp_taskdef_guard denies any other drift.
family: ilmp-service-layer-<+env.variables.ilmp_env_short>
networkMode: awsvpc
requiresCompatibilities:
  - FARGATE
cpu: "256"
memory: "1024"
executionRoleArn: arn:aws:iam::759984737373:role/ilmp-ecs-task-execution
runtimePlatform:
  cpuArchitecture: X86_64
  operatingSystemFamily: LINUX
containerDefinitions:
  - name: service-layer
    image: <+artifact.image>
    essential: true
    portMappings:
      - containerPort: 8080
        protocol: tcp
    environment:
      - name: ENVIRONMENT
        value: <+env.variables.ilmp_env_short>
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: /ecs/ilmp-demo
        awslogs-region: us-east-1
        awslogs-stream-prefix: service-layer-<+env.variables.ilmp_env_short>
tags:
  - key: customer
    value: spdji
  - key: demo
    value: ilmp
