# Rolling stages (Dev, QA, UAT) use svc_tg_arn. Blue/green stages (QADR, Prod) use
# service-definition-bluegreen.yaml, which carries the Harness target group placeholder.
# Spring Boot on 0.25 vCPU needs well over 60s to answer /actuator/health, so
# ECS must ignore ALB health checks until it has had time to start.
launchType: FARGATE
serviceName: ilmp-service-layer-<+env.variables.ilmp_env_short>
desiredCount: 1
networkConfiguration:
  awsvpcConfiguration:
    assignPublicIp: ENABLED
    securityGroups:
      - <+env.variables.ilmp_task_sg>
    subnets:
      - <+env.variables.ilmp_subnet_a>
      - <+env.variables.ilmp_subnet_b>
loadBalancers:
  - targetGroupArn: <+env.variables.svc_tg_arn>
    containerName: service-layer
    containerPort: 8080
deploymentConfiguration:
  maximumPercent: 200
  minimumHealthyPercent: 100
  deploymentCircuitBreaker:
    enable: true
    rollback: false
healthCheckGracePeriodSeconds: 180
propagateTags: SERVICE
tags:
  - key: customer
    value: spdji
  - key: demo
    value: ilmp
